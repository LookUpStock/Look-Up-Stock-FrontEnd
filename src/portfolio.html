<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookUpStock – Portfolios</title>

  <link rel="stylesheet" href="css/style.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">LookUpStock</a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Simulation</a>
      <a href="portfolio.html" class="nav-link active">Portfolios</a>
      <a href="compare.html" class="nav-link">Vergleich</a>
      <a href="app.html#/portfolios" class="nav-link">Mein Bereich</a>
      <!-- Anmeldestatus mit Abmelden (FE #4, US-01) -->
      <div id="auth-status" class="auth-status"></div>
    </nav>
  </header>

  <main class="page-content">
    <section class="status-bar">
      <span>Backend:</span>
      <span id="backend-status">wird geprüft …</span>
    </section>


    <section id="asset-search" class="card">
      <h2>Anlagen suchen</h2>
      <label for="asset-search-input" class="search-label">Ticker, ISIN oder Name</label>
      <input type="search" id="asset-search-input" class="search-input"
             placeholder="z. B. EUNL, IE00B4L5Y983 oder MSCI World" autocomplete="off">
      <p id="asset-search-hint" class="search-hint" aria-live="polite"></p>
      <ul id="asset-search-results" class="search-results"></ul>
    </section>

    <section id="portfolio-editor" class="card portfolio-editor">
      <h2>Portfolio bearbeiten</h2>

      <form id="portfolio-form" class="portfolio-form" novalidate>
        <div class="field-group">
          <label for="portfolio-name">Portfolio-Name</label>
          <input id="portfolio-name" name="portfolio-name" type="text" autocomplete="off" maxlength="100" required>
          <p id="portfolio-name-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="positions-header">
          <h3>Positionen</h3>
          <button id="add-position" type="button">Position hinzufügen</button>
        </div>

        <div id="positions-list" class="positions-list" aria-live="polite"></div>

        <div class="summary-card" aria-labelledby="portfolio-total-label" aria-describedby="portfolio-total-error">
          <div class="summary-row">
            <strong id="portfolio-total-label">Gewichtssumme</strong>
            <span id="portfolio-total-value" class="summary-value">0,00 %</span>
          </div>
          <p id="portfolio-total-status" class="summary-status" role="status" aria-live="polite"></p>
          <p id="portfolio-total-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="action-row">
          <button id="normalize-weights" type="button">Normalisieren</button>
          <button id="equalize-weights" type="button">Gleichgewichten</button>
          <button id="save-portfolio" type="button">Speichern</button>
        </div>
        <p id="portfolio-save-status" class="summary-status" role="status" aria-live="polite"></p>
      </form>

      <div class="saved-portfolios">
        <h3>Gespeicherte Portfolios</h3>
        <p id="saved-portfolios-hint" class="search-hint" aria-live="polite"></p>
        <ul id="saved-portfolios-list" class="saved-portfolios-list"></ul>
      </div>
    </section>

    <div id="error-message" class="error-message" hidden></div>
  </main>

  <footer class="site-footer">
    <p>LookUpStock · DHBW Webprojekt</p>
  </footer>
</body>
</html>
